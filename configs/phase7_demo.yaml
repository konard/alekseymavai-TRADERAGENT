# Phase 7.3: Bybit Production Demo Trading Configuration
# Uses production API keys with api-demo.bybit.com (demo/paper trading)
# ALL instruments must be linear (futures) - demo does NOT support spot
#
# Market prices as of Mar 03, 2026:
#   BTC/USDT ~ $69,390
#   ETH/USDT ~ $2,044
#   SOL/USDT ~ $87.61
#
# Date: March 2026 (updated Mar 03)

# Database Configuration
database_url: ${DATABASE_URL}
database_pool_size: 5

# Logging Configuration
log_level: INFO
log_to_file: true
log_to_console: true
json_logs: true  # Structured logs for production monitoring

# Encryption Key
encryption_key: ${ENCRYPTION_KEY}

# =============================================================================
# P1.1 — Unified Strategy Parameter Model
# Single block for cross-strategy risk parameters.
# Values here become universal defaults; strategy sections may override them.
# =============================================================================
strategy_params:
  risk_per_trade_pct: "0.01"       # 1% of balance per trade (fraction)
  max_position_pct: "0.30"         # 30% of balance max position ($3000 on $10k)
  max_daily_loss_pct: "0.06"       # 6% of balance daily limit ($600 on $10k)
  max_positions: 3                 # max simultaneous positions across strategies
  require_volume_confirmation: true
  min_volume_multiplier: "1.5"     # 1.5× average volume

# Bot Configurations
bots:
  # =========================================================================
  # 1. BTC/USDT Hybrid Strategy (Grid + DCA)
  # Primary bot — auto-starts
  # =========================================================================
  - version: 1
    name: demo_btc_hybrid
    symbol: BTC/USDT
    strategy: hybrid

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true   # Demo Trading (api-demo.bybit.com)
      rate_limit: true

    grid:
      enabled: true
      upper_price: "74000"    # +6.6% from ~$69,390 (Mar 03, 2026)
      lower_price: "64000"    # -7.8% from ~$69,390
      grid_levels: 6
      amount_per_grid: "150"  # $150 per grid (~0.002 BTC, min 0.001 BTC = ~$66)
      profit_per_grid: "0.012" # 1.2% profit per grid

    dca:
      enabled: true
      trigger_percentage: "0.04"      # DCA when price drops 4% below grid
      amount_per_step: "150"          # $150 per DCA step (~0.002 BTC)
      max_steps: 4                    # Max 4 DCA steps
      take_profit_percentage: "0.08"  # Take profit at 8% gain

    risk_management:
      max_position_size: "3000"       # Max $3000 total position
      stop_loss_percentage: "0.12"    # 12% stop loss
      max_daily_loss: "600"           # Max $600 daily loss
      min_order_size: "66"            # Min $66 per order (> 0.001 BTC)
      global_stop_loss_pct: "0.025"   # 2.5% of total capital aggregate risk triggers force-close
      force_close_cooldown_seconds: 1800  # 30-minute cooldown after force-close

    notifications:
      enabled: false

    dry_run: false     # LIVE orders on demo exchange
    auto_start: true   # Auto-start primary bot
    strategy_switch_cooldown_seconds: 600   # 10 min cooldown between strategy switches
    regime_check_interval_seconds: 60       # Check market regime every 60 s

  # =========================================================================
  # 2. ETH/USDT Grid Strategy
  # =========================================================================
  - version: 1
    name: demo_eth_grid
    symbol: ETH/USDT
    strategy: grid

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true
      rate_limit: true

    grid:
      enabled: true
      upper_price: "2150"     # +5.2% from ~$2,044
      lower_price: "1870"     # -8.5% from ~$2,044
      grid_levels: 8
      amount_per_grid: "30"   # $30 per grid → ~0.015 ETH @ $2044 (Bybit min 0.01 ✅)
      profit_per_grid: "0.015" # 1.5% profit per grid

    risk_management:
      max_position_size: "400"
      stop_loss_percentage: "0.15"
      max_daily_loss: "80"
      min_order_size: "30"    # must be >= amount_per_grid

    notifications:
      enabled: false

    dry_run: false
    auto_start: true
    strategy_switch_cooldown_seconds: 600
    regime_check_interval_seconds: 60

  # =========================================================================
  # 3. SOL/USDT DCA Strategy
  # =========================================================================
  - version: 1
    name: demo_sol_dca
    symbol: SOL/USDT
    strategy: dca

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true
      rate_limit: true

    dca:
      enabled: true
      trigger_percentage: "0.02"      # Buy when price drops 2% (was 5% — too strict)
      amount_per_step: "20"           # $20 per step
      max_steps: 5                    # Max 5 steps
      take_profit_percentage: "0.10"  # Take profit at 10%
      min_confluence_score: 0.6       # Reduced from 0.75 — more entries allowed
      catch_up_enabled: true          # Place missing levels on startup

    risk_management:
      max_position_size: "300"
      stop_loss_percentage: "0.18"
      max_daily_loss: "60"
      min_order_size: "5"

    notifications:
      enabled: false

    dry_run: false
    auto_start: true
    strategy_switch_cooldown_seconds: 600
    regime_check_interval_seconds: 60

  # =========================================================================
  # 4. BTC/USDT Trend Follower Strategy
  # =========================================================================
  - version: 1
    name: demo_btc_trend
    symbol: BTC/USDT
    strategy: trend_follower

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true
      rate_limit: true

    trend_follower:
      enabled: true
      ema_fast_period: 20
      ema_slow_period: 50
      atr_period: 14
      rsi_period: 14
      volume_multiplier: "1.5"
      atr_filter_threshold: "0.05"
      tp_atr_multiplier_sideways: "1.2"
      tp_atr_multiplier_weak: "1.8"
      tp_atr_multiplier_strong: "2.5"
      sl_atr_multiplier_sideways: "0.7"
      sl_atr_multiplier_trend: "1.0"
      risk_per_trade_pct: "0.01"        # 1% risk (conservative)
      max_position_size_usd: "1000"
      max_daily_loss_usd: "200"
      max_positions: 2
      log_all_signals: true             # Log all signals for analysis

    risk_management:
      max_position_size: "1000"
      stop_loss_percentage: null  # ATR-based via trend_follower strategy
      max_daily_loss: "200"
      min_order_size: "5"

    notifications:
      enabled: false

    dry_run: false
    auto_start: true   # Enabled (was false)
    strategy_switch_cooldown_seconds: 600
    regime_check_interval_seconds: 60

  # =========================================================================
  # 5. BTC/USDT SMC (Smart Money Concepts) Strategy
  # =========================================================================
  - version: 1
    name: demo_btc_smc
    symbol: BTC/USDT
    strategy: smc

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true
      rate_limit: true

    smc:
      enabled: true
      swing_length: 10          # Reduced from 50 → warmup 40 bars instead of 200
      risk_per_trade_pct: "0.02"  # 2% risk per trade (fraction of balance)
      min_risk_reward: "2.0"    # Reduced from 2.5 — more signals
      max_position_size: "1666"
      max_positions: 3

    risk_management:
      max_position_size: "5000"
      stop_loss_percentage: "0.15"
      min_order_size: "10"

    notifications:
      enabled: false

    dry_run: false     # Live trading enabled (was true)
    auto_start: true
    strategy_switch_cooldown_seconds: 600
    regime_check_interval_seconds: 60

  # =========================================================================
  # 6. BTC/USDT SMC M5 Strategy (H1 structure → M5 precision entry)
  # dry_run=true, auto_start=false until verified via backtest
  # Sharpe acceptance gate: must beat M15 approach in backtest
  # =========================================================================
  - version: 1
    name: demo_btc_smc_m5
    symbol: BTC/USDT
    strategy: smc

    exchange:
      exchange_id: bybit
      credentials_name: bybit_demo
      sandbox: true
      rate_limit: true

    smc:
      enabled: true
      swing_length_h1: 10       # H1 structure: 10 bars (unchanged default)
      swing_length_m5: 20       # M5 entry: 20 bars = 100-min noise filter
      m5_limit: 1000            # ~3.5 days of M5 data
      h1_limit: 200             # H1 history (structure)
      risk_per_trade_pct: "0.01"  # 1% risk per trade (fraction of balance; M5 generates more signals)
      min_risk_reward: "2.0"    # Reduced from 2.5 (M5 levels less clean)
      max_positions: 2

    risk_management:
      max_position_size: "5000"
      stop_loss_percentage: "0.15"
      min_order_size: "10"

    notifications:
      enabled: false

    dry_run: true        # Start in dry_run; switch to false after backtest Sharpe >= M15
    auto_start: false    # Enable manually after verification
