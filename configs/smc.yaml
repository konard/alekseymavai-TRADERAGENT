# configs/smc.yaml — SMC Analysis Module Configuration
#
# Параметры анализатора SMC (Smart Money Concepts).
# Используется как SMCAnalyzer, так и SMCStrategy (standalone бот).

smc_analyzer:
  # Число баров слева/справа для подтверждения свинг-точки.
  # LuxAlgo по умолчанию = 5. Больше → меньше сигналов, надёжнее.
  swing_strength: 5

  # Минимум баров для "разогрева" до готовности контекста.
  # До этого порога warmup_complete = False.
  min_warmup_bars: 200

  # Структурный детектор: минимальный импульс пробоя (кратно ATR).
  # Фильтрует ложные пробои на малом импульсе.
  min_impulse_atr: 0.3

  # FVG детектор: минимальный размер гэпа (кратно ATR).
  min_fvg_atr: 0.2

  # EQH/EQL кластеризация: допуск по цене (0.002 = 0.2%).
  tolerance_pct: 0.002

  # Минимальное число касаний для формирования уровня EQH/EQL.
  min_eq_touches: 2

  # Максимальный lookback (в барах) при поиске OB-свечи.
  max_ob_lookback: 20

  # Лимит хранимых OB и FVG (только самые свежие).
  max_ob_count: 10
  max_fvg_count: 10


smc_strategy:
  # Включить стратегию как отдельного бота (approach 2).
  enabled: false

  # Пара и таймфрейм.
  symbol: "BTCUSDT"
  timeframe: "5m"

  # Минимальное число баров для загрузки истории при старте.
  # Должно быть >= min_warmup_bars + 2*swing_strength.
  history_bars: 500

  # Минимальное risk/reward для входа.
  min_risk_reward: 1.5

  # ATR-мультипликатор для Stop Loss.
  sl_atr_multiplier: 2.0

  # ATR-мультипликатор для Take Profit.
  tp_atr_multiplier: 4.0

  # Риск на сделку (% от баланса).
  risk_per_trade_pct: 1.0

  # Максимум одновременных позиций.
  max_positions: 2

  # Торговать в лонг/шорт.
  trade_long: true
  trade_short: true

  # Требовать FVG-подтверждение при входе.
  require_fvg_confirmation: false

  # Требовать попадание в OB-зону при входе.
  require_ob_entry: true

  # Минимальная уверенность сигнала (0.0–1.0).
  min_confidence: 0.6
