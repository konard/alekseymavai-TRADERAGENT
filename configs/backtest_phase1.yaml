# Phase 1 Backtest Configuration
# ================================
# Используется для разведочного прогона по всем парам (37-45).
# Цель: найти лучшую стратегию для каждой пары через оркестратор с режимным роутером.
#
# Архитектура: одна пара = один прогон со всеми 4 стратегиями.
# Роутер активирует нужную стратегию по режиму рынка:
#   TIGHT_RANGE  → Grid
#   BULL_TREND   → TrendFollower
#   BEAR_TREND   → DCA
#   BREAKOUT     → SMC
#
# Результат: strategy_score_matrix.json — Sharpe/Return/Trades по каждой стратегии
# на каждой паре за периоды её активности.
#
# Запуск:
#   python scripts/run_backtest_v2.py \
#     --mode auto \
#     --config configs/backtest_phase1.yaml \
#     --data-dir data/historical \
#     --max-bars 50000 \
#     --workers 14 \
#     --output-dir results/phase1_full
#
# Дата создания: 2026-03-06

# ---------------------------------------------------------------------------
# Глобальные параметры прогона
# ---------------------------------------------------------------------------

backtest:
  initial_balance: 1000          # $1000 на пару (10 слотов × $1000 = $10k портфель)
  warmup_bars: 500               # 500 × 5m = ~42 часа прогрева
  max_bars: 50000                # ~173 дня (~6 месяцев) торговли
  workers: 14                    # параллельных процессов (по числу CPU)
  vpm_max_grid_loss_pct: 0.25   # VPM агрегированный SL для Grid — 25% (live=10%, в backtest мягче)

  # Пары исключённые из Phase 1 (аномальные данные — делистинг/крах)
  exclude_symbols:
    - FTTUSDT    # FTX Token — биржа FTX обанкротилась Nov 2022, цена → 0
    - LUNAUSDT   # Terra Luna — крах May 2022, цена упала с $80 до $0.0001

# ---------------------------------------------------------------------------
# Параметры оркестратора
# ---------------------------------------------------------------------------

orchestrator:
  enable_strategy_router: true
  router_cooldown_bars: 2        # 600 сек cooldown / 300 сек на бар M5 = 2 бара (как в live-боте)
  regime_check_every_n: 12       # каждые 12 × 5m = 1 час (как в live)
  analyze_every_n: 1             # анализировать каждый бар (SMC: каждый M5)
  smc_generate_signal_every_n: 12  # SMC signal every 12 bars = 1h (performance vs accuracy trade-off)

# ---------------------------------------------------------------------------
# Risk management (единый для всех стратегий и пар)
# ---------------------------------------------------------------------------

risk:
  max_position_pct: 0.25         # max 25% баланса в совокупности позиций ($250 из $1000)
  max_position_pct_per_trade: 0.05  # max 5% на одну сделку ($50 из $1000) → до 5 позиций
  max_daily_loss_pct: 0.06       # max 6% дневного убытка ($60 из $1000)
  min_order_size: 5              # минимум $5 на ордер

# ---------------------------------------------------------------------------
# Стратегия: Grid
# Активна в: TIGHT_RANGE
# Параметры — нейтральные для любой пары
# ---------------------------------------------------------------------------

grid:
  enabled: true
  num_levels: 20                 # 20 уровней (было 10) — оптимум N*=R/√(C·ATR)≈22
  profit_per_grid: 0.005         # 0.5% прибыль (было 0.8%) — ближе к S*=√(C·ATR)≈0.55%
  grid_range_pct: 0.12           # 12% диапазон сетки — меньше рецентров
  recenter_cooldown_bars: 24     # кулдаун рецентра: 24 × 5m = 2 часа
  # amount_per_grid рассчитывается автоматически:
  # initial_balance × max_position_pct / num_levels = $1000 × 0.25 / 20 = ~$12.5

# ---------------------------------------------------------------------------
# Стратегия: DCA
# Активна в: BEAR_TREND
# ---------------------------------------------------------------------------

dca:
  enabled: true
  trigger_pct: 0.03              # покупать при падении на 3% (было 4%)
  max_steps: 3                   # максимум 3 уровня DCA (было 4-5) — ограничение мартингейла
  take_profit_pct: 0.06          # тейк-профит 6% (было 8-10%) — чаще фиксирует прибыль
  safety_order_size: 50          # $50 на каждый шаг DCA
  catch_up_enabled: true         # Pre-open catch-up ордера на старте
  martingale_multiplier: 1.3     # мультипликатор объёма DCA (ограничивает рост позиции)
  hard_stop_loss_pct: 15         # принудительный выход при убытке -15% на всю DCA-позицию
  max_holding_bars: 288          # принудительный выход через 24ч (288 × M5)
  trend_filter_adx: 30           # не входить если ADX > 30 и тренд медвежий

# ---------------------------------------------------------------------------
# Стратегия: TrendFollower
# Активна в: BULL_TREND, STRONG_BULL
# ---------------------------------------------------------------------------

trend_follower:
  enabled: true
  ema_fast_period: 20
  ema_slow_period: 50
  atr_period: 14
  rsi_period: 14
  risk_per_trade_pct: 0.01       # 1% риска на сделку ($10 из $1000)
  require_volume_confirmation: false  # снят блокирующий фильтр (было true)
  tp_atr_multiplier_sideways: 1.2    # оптимум по модели: k_tp* ≈ 1.1 при μ/σ=0.05
  tp_atr_multiplier_weak: 1.8
  tp_atr_multiplier_strong: 4.0      # было 2.5 — шире цель при сильном тренде
  sl_atr_multiplier_sideways: 0.7
  sl_atr_multiplier_trend: 1.0
  max_positions: 2

# ---------------------------------------------------------------------------
# Стратегия: SMC (Smart Money Concepts)
# Активна в: BREAKOUT, при подтверждении структуры
# ---------------------------------------------------------------------------

smc:
  enabled: true
  swing_length: 10               # 10 баров = 50-минутный фрактал (M5)
  risk_per_trade: 0.01           # 1% риска на сделку
  min_risk_reward: 2.0           # минимальный R:R 2:1
  max_positions: 2
  require_volume_confirmation: false   # отключено для backtest (нет Volume Spike)
  debug_mode: false
  log_all_signals: false         # отключено для производительности (иначе 2.6M строк)
