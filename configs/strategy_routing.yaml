# Strategy Routing Configuration — Single Source of Truth
#
# This file defines the mapping between market regimes and active strategies
# for BOTH the live bot (StrategySelector) and backtesting (StrategyRouter).
#
# Structure:
#   rules:        Ordered list of routing rules. Each rule matches on `conditions`
#                 and specifies the `strategies` to activate.
#   fallback:     Default strategies when no specific rule matches (optional).
#
# Conditions:
#   market_regime:     One of the MarketRegime enum values (see market_regime.py).
#   recommended_strategy: One of the RecommendedStrategy enum values (optional filter).
#
# Strategies:
#   type:    Strategy type identifier (grid, dca, trend_follower, smc).
#   weight:  Allocation weight (0.0 – 1.0); used by live StrategySelector.
#   priority: Priority for signal conflict resolution (lower = higher priority).
#
# Notes:
#   - Rules are evaluated in order; the FIRST matching rule wins.
#   - HYBRID recommended strategy activates the special hybrid_weights block.
#   - REDUCE_EXPOSURE recommended strategy means no strategies active (empty list).
#   - HOLD recommended strategy means "keep current strategies unchanged".
#   - Regimes not matched by any rule use the fallback (default: empty list).

version: "1.0"

# Special weights applied when recommended_strategy == HYBRID
# (BULL_TREND with high confluence)
hybrid_weights:
  - type: dca
    weight: 0.5
    priority: 1
  - type: grid
    weight: 0.3
    priority: 2
  - type: trend_follower
    weight: 0.2
    priority: 3

rules:
  # ── Range regimes → Grid ──────────────────────────────────────────────────
  - name: tight_range
    conditions:
      market_regime: tight_range
    strategies:
      - type: grid
        weight: 1.0
        priority: 1

  - name: wide_range
    conditions:
      market_regime: wide_range
    strategies:
      - type: grid
        weight: 1.0
        priority: 1

  # ── Transition regimes ────────────────────────────────────────────────────
  - name: quiet_transition
    conditions:
      market_regime: quiet_transition
    strategies:
      - type: grid
        weight: 0.7
        priority: 1

  - name: volatile_transition
    conditions:
      market_regime: volatile_transition
    strategies:
      - type: smc
        weight: 1.0
        priority: 1

  # ── Trending regimes ──────────────────────────────────────────────────────
  - name: bull_trend
    conditions:
      market_regime: bull_trend
    strategies:
      - type: trend_follower
        weight: 0.7
        priority: 1
      - type: dca
        weight: 0.3
        priority: 2

  - name: bear_trend
    conditions:
      market_regime: bear_trend
    strategies:
      - type: dca
        weight: 1.0
        priority: 1

  # ── SMC regimes ───────────────────────────────────────────────────────────
  - name: accumulation
    conditions:
      market_regime: accumulation
    strategies:
      - type: smc
        weight: 1.0
        priority: 1

  - name: distribution
    conditions:
      market_regime: distribution
    strategies:
      - type: smc
        weight: 1.0
        priority: 1

  # ── Unknown / no-regime ───────────────────────────────────────────────────
  - name: unknown
    conditions:
      market_regime: unknown
    strategies: []

# Default when no rule matches — safe fallback (no strategies active)
fallback:
  strategies: []
