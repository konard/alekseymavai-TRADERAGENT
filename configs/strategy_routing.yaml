# Strategy Routing Configuration
# Single source of truth for strategy selection rules.
#
# Rules are evaluated in order — the FIRST matching rule wins.
# Each rule has:
#   conditions: key-value pairs that must ALL match (AND logic)
#   strategies: list of strategies to activate with optional params
#
# Supported condition keys:
#   market_regime: MarketRegime enum value (e.g. "bull_trend", "bear_trend")
#   volatility_regime: "low" | "high"  (based on atr_pct threshold of 1%)
#   confluence_high: true | false       (confluence_score >= 0.7)
#   adx_high: true | false             (adx > 25.0, mirrors HybridCoordinator)
#
# Supported strategy names: grid, dca, trend_follower, smc
#
# Reference: bot/orchestrator/strategy_selector.py DEFAULT_REGIME_STRATEGIES

rules:
  # ── Trend regimes ─────────────────────────────────────────────────────────

  # BULL_TREND + high confluence + ADX > 25 → DCA primary (mirrors HybridCoordinator)
  - name: bull_trend_hybrid_dca
    conditions:
      market_regime: bull_trend
      confluence_high: true
      adx_high: true
    strategies:
      - name: dca
        params:
          weight: 0.5
          priority: 1
      - name: trend_follower
        params:
          weight: 0.3
          priority: 2
      - name: smc
        params:
          weight: 0.2
          priority: 3

  # BULL_TREND + high confluence + ADX ≤ 25 → Grid primary (mirrors HybridCoordinator)
  - name: bull_trend_hybrid_grid
    conditions:
      market_regime: bull_trend
      confluence_high: true
    strategies:
      - name: grid
        params:
          weight: 0.5
          priority: 1
      - name: trend_follower
        params:
          weight: 0.3
          priority: 2
      - name: smc
        params:
          weight: 0.2
          priority: 3

  # BULL_TREND normal → trend_follower (primary) + smc secondary
  # DCA removed: CapitalArbiter blocks DCA in _UPTREND (allocation=0.00)
  - name: bull_trend_default
    conditions:
      market_regime: bull_trend
    strategies:
      - name: trend_follower
        params:
          weight: 0.7
          priority: 1
      - name: smc
        params:
          weight: 0.3
          priority: 2

  # BEAR_TREND → smc + trend_follower (both can SHORT; DCA is LONG-only → losses in bear)
  - name: bear_trend
    conditions:
      market_regime: bear_trend
    strategies:
      - name: smc
        params:
          weight: 0.7
          priority: 1
      - name: trend_follower
        params:
          weight: 0.3
          priority: 2

  # ── Range regimes ──────────────────────────────────────────────────────────

  # TIGHT_RANGE → grid only (DCA removed: CapitalArbiter blocks DCA in _SIDEWAYS → conflict)
  - name: tight_range
    conditions:
      market_regime: tight_range
    strategies:
      - name: grid
        params:
          weight: 1.0
          priority: 1

  # WIDE_RANGE → grid only (DCA removed: CapitalArbiter blocks DCA in _SIDEWAYS → conflict)
  - name: wide_range
    conditions:
      market_regime: wide_range
    strategies:
      - name: grid
        params:
          weight: 1.0
          priority: 1

  # ── Transition regimes ─────────────────────────────────────────────────────

  # QUIET_TRANSITION → smc only.
  # Grid removed: QUIET_TRANSITION often precedes trend breakouts —
  # running grid here leads to large losses when the "quiet" market
  # suddenly trends. SMC is better suited to catch structural entries.
  - name: quiet_transition
    conditions:
      market_regime: quiet_transition
    strategies:
      - name: smc
        params:
          weight: 1.0
          priority: 1

  # VOLATILE_TRANSITION → smc
  - name: volatile_transition
    conditions:
      market_regime: volatile_transition
    strategies:
      - name: smc
        params:
          weight: 1.0
          priority: 1

  # ── SMC accumulation / distribution regimes ────────────────────────────────

  # ACCUMULATION → smc (smart money accumulating, potential reversal up)
  - name: accumulation
    conditions:
      market_regime: accumulation
    strategies:
      - name: smc
        params:
          weight: 1.0
          priority: 1

  # DISTRIBUTION → smc (smart money distributing, potential reversal down)
  - name: distribution
    conditions:
      market_regime: distribution
    strategies:
      - name: smc
        params:
          weight: 1.0
          priority: 1

  # ── Fallback ───────────────────────────────────────────────────────────────

  # Default fallback: activate all strategies with equal priority.
  # Matches when no other rule applies (e.g. UNKNOWN regime).
  - name: fallback
    conditions: {}
    strategies:
      - name: grid
        params:
          weight: 0.25
          priority: 1
      - name: dca
        params:
          weight: 0.25
          priority: 2
      - name: trend_follower
        params:
          weight: 0.25
          priority: 3
      - name: smc
        params:
          weight: 0.25
          priority: 4
